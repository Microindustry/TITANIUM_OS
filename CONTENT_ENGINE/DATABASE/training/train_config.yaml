### TITANIUM_OS Personal LLM — LLaMA-Factory LoRA CPU config
### Modello: TinyLlama-1.1B-Chat-v1.0 (1.1B params — ottimale per CPU)
### Dataset: 180 esempi da episodi TITANIUM_OS
### Esecuzione: notte (Task Scheduler), solo CPU

model_name_or_path: TinyLlama/TinyLlama-1.1B-Chat-v1.0

### Dataset
dataset: titanium_os
dataset_dir: C:\Users\benen\TITANIUM_OS\TITANIUM_OS\CONTENT_ENGINE\DATABASE\training
template: default

### LoRA
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1
lora_target: all

### Training
num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 0.0002
lr_scheduler_type: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0

### Output
output_dir: C:\Users\benen\TITANIUM_OS\TITANIUM_OS\MODELS\titanium_llm_v1
logging_steps: 10
save_steps: 50
save_total_limit: 2

### CPU ottimizzazioni
use_fast_tokenizer: true
dataloader_num_workers: 0
fp16: false
bf16: false

### Seed per riproducibilità
seed: 42
