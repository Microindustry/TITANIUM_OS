<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Nina · Personaggio</title>
<meta name="hz:slide-selector" content=".slide" />
<meta name="hz:canvas-width" content="1080" />
<meta name="hz:canvas-height" content="1350" />
<link rel="stylesheet" href="https://use.typekit.net/zhv2kry.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#05070d; }
body { display:flex; justify-content:center; padding:0; }
.slide { position:relative; width:1080px; height:1350px; overflow:hidden;
  background: radial-gradient(120% 75% at 50% 40%, #16321f 0%, #0c1a16 46%, #05070d 100%);
  font-family:"source-sans-3",sans-serif; color:#eef2fb; }
.grid { position:absolute; inset:30px; opacity:0.04;
  background-image: linear-gradient(#4fd6a0 1px, transparent 1px), linear-gradient(90deg,#4fd6a0 1px, transparent 1px);
  background-size:54px 54px; }
.frame { position:absolute; inset:30px; border:1px solid rgba(148,163,184,0.22); border-radius:4px; }
.toplabel { position:absolute; top:60px; left:0; right:0; text-align:center;
  font-family:"space-mono",monospace; font-size:17px; letter-spacing:6px; color:#8595b4; text-transform:uppercase; }
.kicker { position:absolute; top:150px; left:0; right:0; text-align:center;
  font-family:"space-mono",monospace; font-size:16px; letter-spacing:6px; color:#34d399; text-transform:uppercase; }
.name { position:absolute; top:none; bottom:300px; left:0; right:0; text-align:center;
  font-family:"playfair-display",serif; font-weight:800; font-size:96px; color:#f6f8ff; letter-spacing:1px; }
.role { position:absolute; bottom:248px; left:0; right:0; text-align:center;
  font-family:"space-mono",monospace; font-size:20px; letter-spacing:5px; color:#ec4899; text-transform:uppercase; }
.super { position:absolute; bottom:150px; left:140px; right:140px; text-align:center;
  font-size:30px; line-height:1.5; color:#c3cce0; }
.super .hi { color:#f6f8ff; font-weight:600; } .super .pk { color:#ec4899; font-weight:700; }
.footer { position:absolute; left:60px; right:60px; bottom:60px; display:flex; align-items:center; justify-content:space-between;
  font-family:"space-mono",monospace; font-size:15px; letter-spacing:2px; color:#7f8db0; }
.footer .dot { color:#34d399; } .footer .nina { color:#ec4899; }
</style>
</head>
<body>
<div class="slide" data-canvas-width="1080" data-canvas-height="1350">
  <div class="grid"></div><div class="frame"></div>
  <div class="toplabel">Titanium&nbsp;OS · L'Avventura</div>
  <div class="kicker">I Personaggi · 01</div>

  <!-- ===== NINA — illustrazione vettoriale ===== -->
  <svg style="position:absolute; top:210px; left:50%; transform:translateX(-50%); width:620px; height:760px;"
       viewBox="0 0 620 760" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="halo" cx="50%" cy="42%" r="55%">
        <stop offset="0%" stop-color="#5ff0b0" stop-opacity="0.45"/>
        <stop offset="55%" stop-color="#34d399" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffe2c9"/><stop offset="100%" stop-color="#f3bf9d"/>
      </linearGradient>
      <linearGradient id="skinArm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe2c9"/><stop offset="100%" stop-color="#f0b793"/>
      </linearGradient>
      <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6b4a32"/><stop offset="55%" stop-color="#4e3522"/><stop offset="100%" stop-color="#3a271a"/>
      </linearGradient>
      <linearGradient id="hairHi" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#caa06f" stop-opacity="0.9"/><stop offset="100%" stop-color="#caa06f" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d7e6e0"/>
      </linearGradient>
      <linearGradient id="coatShade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#9fc4b7" stop-opacity="0.55"/><stop offset="100%" stop-color="#9fc4b7" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2bd4a0"/><stop offset="100%" stop-color="#16a878"/>
      </linearGradient>
      <radialGradient id="iris" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#7a5a3c"/><stop offset="100%" stop-color="#3f2a18"/>
      </radialGradient>
      <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff9bb5" stop-opacity="0.7"/><stop offset="100%" stop-color="#ff9bb5" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- alone -->
    <ellipse cx="310" cy="330" rx="300" ry="320" fill="url(#halo)"/>

    <!-- ===== BRACCIO ALZATO (curiosità: indica in su) ===== -->
    <g>
      <path d="M388,372 C430,330 452,250 452,196 C452,176 478,176 480,196 C484,250 470,344 430,402 Z" fill="url(#coat)"/>
      <path d="M452,210 C452,250 440,322 416,372 L430,402 C470,344 484,250 480,196 C478,182 462,182 452,196 Z" fill="url(#coatShade)"/>
      <!-- mano + dito -->
      <circle cx="464" cy="182" r="26" fill="url(#skinArm)"/>
      <path d="M456,188 C452,150 460,120 470,120 C480,120 484,152 478,190 Z" fill="url(#skinArm)"/>
      <ellipse cx="473" cy="120" rx="9" ry="11" fill="#ffe2c9"/>
    </g>

    <!-- ===== CORPO / CAMICE ===== -->
    <g>
      <!-- camice -->
      <path d="M180,470 C180,430 232,402 310,402 C388,402 440,430 440,470 L470,720 L150,720 Z" fill="url(#coat)"/>
      <path d="M310,402 C388,402 440,430 440,470 L470,720 L360,720 L330,470 Z" fill="url(#coatShade)"/>
      <!-- maglia verde sotto (scollo a V) -->
      <path d="M262,408 L310,520 L358,408 C342,400 326,398 310,398 C294,398 278,400 262,408 Z" fill="url(#shirt)"/>
      <!-- bordo camice -->
      <path d="M310,402 L300,720 M310,402 L320,720" stroke="#bcd6cb" stroke-width="3" fill="none" opacity="0.8"/>
      <!-- sciarpina rosa (accento Nina) -->
      <path d="M268,410 C290,440 330,440 352,410 C352,432 332,452 310,452 C288,452 268,432 268,410 Z" fill="#ec4899"/>
      <path d="M345,420 L372,470 L352,476 L332,438 Z" fill="#d63384"/>
    </g>

    <!-- ===== COLLO ===== -->
    <path d="M286,336 L286,392 C286,408 334,408 334,392 L334,336 Z" fill="url(#skin)"/>
    <path d="M286,360 C300,378 320,378 334,360 L334,336 L286,336 Z" fill="#e9ad88" opacity="0.6"/>

    <!-- ===== CAPELLI (dietro) ===== -->
    <path d="M196,250 C196,150 414,150 414,250 L420,360 C420,300 404,300 400,346 L210,346 C206,300 190,300 190,360 Z" fill="url(#hair)"/>

    <!-- ===== TESTA ===== -->
    <g>
      <ellipse cx="305" cy="262" rx="118" ry="126" fill="url(#skin)"/>
      <!-- orecchie -->
      <circle cx="192" cy="266" r="20" fill="url(#skin)"/><circle cx="418" cy="266" r="20" fill="url(#skin)"/>
      <!-- guance -->
      <ellipse cx="246" cy="300" rx="30" ry="20" fill="url(#cheek)"/>
      <ellipse cx="368" cy="300" rx="30" ry="20" fill="url(#cheek)"/>
      <!-- occhi -->
      <g>
        <ellipse cx="258" cy="262" rx="34" ry="40" fill="#ffffff"/>
        <ellipse cx="352" cy="262" rx="34" ry="40" fill="#ffffff"/>
        <circle cx="264" cy="268" r="23" fill="url(#iris)"/>
        <circle cx="346" cy="268" r="23" fill="url(#iris)"/>
        <circle cx="264" cy="268" r="10" fill="#1c130b"/>
        <circle cx="346" cy="268" r="10" fill="#1c130b"/>
        <circle cx="272" cy="259" r="7" fill="#ffffff"/>
        <circle cx="354" cy="259" r="7" fill="#ffffff"/>
        <circle cx="258" cy="276" r="3" fill="#ffffff" opacity="0.8"/>
        <circle cx="340" cy="276" r="3" fill="#ffffff" opacity="0.8"/>
      </g>
      <!-- sopracciglia (curiose, una alzata) -->
      <path d="M232,214 Q258,202 286,212" stroke="#4e3522" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M324,206 Q352,196 380,210" stroke="#4e3522" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- naso -->
      <path d="M305,286 q8,10 -2,16" stroke="#e0a07e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- bocca: sorriso curioso -->
      <path d="M276,322 Q305,352 336,322" stroke="#c25a5a" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M286,328 Q305,344 324,328 Z" fill="#ffb3b3" opacity="0.7"/>
    </g>

    <!-- ===== CAPELLI (davanti, caschetto) ===== -->
    <g>
      <path d="M188,266 C176,150 250,118 305,118 C360,118 434,150 422,266
               C420,210 392,196 392,196 C392,196 404,236 392,250
               C386,206 360,176 360,176 C360,176 366,214 352,224
               C336,182 305,176 305,176 C305,176 300,182 286,210
               C260,182 250,176 250,176 C250,176 256,214 240,224
               C228,200 220,200 220,238 C210,210 198,214 188,266 Z" fill="url(#hair)"/>
      <path d="M210,200 C240,168 280,160 300,162 C262,176 236,200 222,236 Z" fill="url(#hairHi)"/>
      <!-- fiocco/molletta rosa -->
      <g transform="translate(386,196)">
        <path d="M0,0 L26,-12 L22,8 Z" fill="#ec4899"/><path d="M0,0 L26,14 L30,-6 Z" fill="#d63384"/>
        <circle cx="6" cy="1" r="6" fill="#ffd1e3"/>
      </g>
    </g>

    <!-- ===== SIMBOLO: il "?" + la porticina (la sua superpotenza) ===== -->
    <g transform="translate(150,150)">
      <circle cx="0" cy="0" r="34" fill="#0c1a16" stroke="#ec4899" stroke-width="2.5"/>
      <text x="0" y="16" text-anchor="middle" font-family="playfair-display,serif" font-size="52" font-weight="800" fill="#ec4899">?</text>
    </g>
  </svg>

  <div class="name">Nina</div>
  <div class="role">La bambina che chiede perché</div>
  <div class="super">La sua superpotenza: <span class="pk">chiedere «perché?»</span> e poi <span class="hi">andare a vedere davvero</span>. Apre porte che gli altri non vedono.</div>

  <div class="footer"><span><span class="dot">⟡</span>&nbsp;Personaggi</span><span class="nina">NINA</span><span>01 / 04</span></div>
</div>
</body>
</html>
