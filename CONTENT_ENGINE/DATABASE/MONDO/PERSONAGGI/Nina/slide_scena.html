<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Nina · Scena</title>
<meta name="hz:slide-selector" content=".slide" />
<meta name="hz:canvas-width" content="1080" />
<meta name="hz:canvas-height" content="1350" />
<link rel="stylesheet" href="https://use.typekit.net/zhv2kry.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#05070d; }
body { display:flex; justify-content:center; padding:0; }
.slide { position:relative; width:1080px; height:1350px; overflow:hidden; background:#0c1a16;
  font-family:"source-sans-3",sans-serif; color:#eef2fb; }
.scene { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 42%; }
/* velature per leggibilità */
.vtop { position:absolute; top:0; left:0; right:0; height:300px;
  background:linear-gradient(180deg, rgba(5,7,13,0.72) 0%, rgba(5,7,13,0) 100%); }
.vbot { position:absolute; bottom:0; left:0; right:0; height:560px;
  background:linear-gradient(0deg, rgba(5,9,8,0.92) 0%, rgba(5,9,8,0.78) 30%, rgba(5,9,8,0) 100%); }
.frame { position:absolute; inset:26px; border:1px solid rgba(255,255,255,0.18); border-radius:4px; }
.toplabel { position:absolute; top:54px; left:0; right:0; text-align:center;
  font-family:"space-mono",monospace; font-size:17px; letter-spacing:6px; color:#cdd7ea; text-transform:uppercase; }
.kicker { position:absolute; top:92px; left:0; right:0; text-align:center;
  font-family:"space-mono",monospace; font-size:15px; letter-spacing:6px; color:#5fe6b0; text-transform:uppercase; }
.sym { position:absolute; top:140px; left:64px; width:72px; height:72px; border-radius:50%;
  background:rgba(12,26,22,0.7); border:2.5px solid #ec4899; display:flex; align-items:center; justify-content:center;
  font-family:"playfair-display",serif; font-weight:800; font-size:40px; color:#ec4899;
  box-shadow:0 0 24px rgba(236,72,153,0.4); backdrop-filter:blur(2px); }
.name { position:absolute; bottom:300px; left:0; right:0; text-align:center;
  font-family:"playfair-display",serif; font-weight:800; font-size:112px; color:#f8faff; letter-spacing:1px; line-height:1;
  text-shadow:0 6px 30px rgba(0,0,0,0.55); }
.role { position:absolute; bottom:250px; left:0; right:0; text-align:center;
  font-family:"space-mono",monospace; font-size:20px; letter-spacing:5px; color:#ff7ab6; text-transform:uppercase; }
.super { position:absolute; bottom:140px; left:130px; right:130px; text-align:center;
  font-size:28px; line-height:1.5; color:#dfe6f2; text-shadow:0 2px 12px rgba(0,0,0,0.6); }
.super .hi { color:#ffffff; font-weight:600; } .super .pk { color:#ff7ab6; font-weight:700; }
.footer { position:absolute; left:56px; right:56px; bottom:54px; display:flex; align-items:center; justify-content:space-between;
  font-family:"space-mono",monospace; font-size:15px; letter-spacing:2px; color:#aeb9d2; }
.footer .dot { color:#5fe6b0; } .footer .nina { color:#ff7ab6; }
</style>
</head>
<body>
<div class="slide" data-canvas-width="1080" data-canvas-height="1350">
  <img class="scene" src="_SCENE/nina_scena_A_studio.png" alt="Nina nella sua scena">
  <div class="vtop"></div><div class="vbot"></div>
  <div class="frame"></div>
  <div class="toplabel">Titanium&nbsp;OS · L'Avventura</div>
  <div class="kicker">I Personaggi · 01</div>
  <div class="sym">?</div>

  <div class="name">Nina</div>
  <div class="role">La ragazza che chiede perché</div>
  <div class="super">Brava ragazza… e <span class="pk">piccolo genio curioso</span>: chiede «perché?» e poi <span class="hi">va a vedere davvero</span>.</div>

  <div class="footer"><span><span class="dot">⟡</span>&nbsp;Personaggi</span><span class="nina">NINA</span><span>01 / 04</span></div>
</div>
</body>
</html>
