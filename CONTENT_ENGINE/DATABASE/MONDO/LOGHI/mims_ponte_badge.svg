<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="arcTop" d="M30 100 A70 70 0 0 1 170 100" />
    <path id="arcBot" d="M36 100 A64 64 0 0 0 164 100" />
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd98a"/><stop offset="100%" stop-color="#f4b65a"/>
    </linearGradient>
  </defs>

  <!-- disco -->
  <circle cx="100" cy="100" r="93" fill="#0c1a16"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#ring)" stroke-width="3.5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#f4b65a" stroke-width="1" opacity="0.45"/>

  <!-- arco-ponte: unisce Atomi (oro) e Bit (ciano) -->
  <g fill="none" stroke="#eef2fb" stroke-width="3.4" stroke-linecap="round">
    <path d="M56 120 Q100 74 144 120"/>            <!-- arcata -->
    <line x1="40" y1="142" x2="160" y2="142"/>      <!-- impalcato -->
    <line x1="56" y1="120" x2="56" y2="142"/>       <!-- pila sx -->
    <line x1="144" y1="120" x2="144" y2="142"/>     <!-- pila dx -->
    <line x1="78" y1="92" x2="78" y2="128"/>        <!-- tiranti -->
    <line x1="100" y1="80" x2="100" y2="128"/>
    <line x1="122" y1="92" x2="122" y2="128"/>
  </g>
  <circle cx="56" cy="120" r="6.5" fill="#f4b65a"/>   <!-- nodo Atomi -->
  <circle cx="144" cy="120" r="6.5" fill="#5fc7f3"/>  <!-- nodo Bit -->

  <!-- testo curvo -->
  <text font-family="'Space Mono', monospace" font-weight="700" fill="#f4b65a" font-size="26" letter-spacing="6">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">MIMS</textPath>
  </text>
  <text font-family="'Space Mono', monospace" font-weight="700" fill="#9fb0d0" font-size="11" letter-spacing="4">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">TITANIUM·OS</textPath>
  </text>
</svg>
