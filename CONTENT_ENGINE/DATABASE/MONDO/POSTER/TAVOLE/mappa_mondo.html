<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#05070d}
.poster{position:relative;width:1123px;height:1587px;overflow:hidden;

.head .brand{font-size:16px;letter-spacing:8px;color:#8595b4}
.head .title{font-family:'Playfair Display',serif;font-weight:700;font-size:60px;color:#f6f8ff;margin-top:14px}
.head .sub{font-size:15px;letter-spacing:4px;color:#7f8db0;margin-top:12px}
.foot{position:absolute;bottom:64px;left:80px;right:80px;display:flex;justify-content:space-between;
  font-size:15px;letter-spacing:3px;color:#7f8db0}
.foot .nina{color:#ec4899}
.lbl{font-family:'Space Mono',monospace;font-weight:700;font-size:21px}
.lblsub{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:3px;fill:#8595b4}
</style></head><body>
