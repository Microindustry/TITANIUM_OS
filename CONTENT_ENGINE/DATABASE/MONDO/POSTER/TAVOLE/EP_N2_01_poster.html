<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Nina · EP_N2_01 — La Bambina che Chiedeva Perché</title>
<meta name="hz:slide-selector" content=".poster" />
<meta name="hz:canvas-width" content="1123" />
<meta name="hz:canvas-height" content="1587" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #05070d; }
body { display: flex; justify-content: center; align-items: center; }

.poster {
  position: relative;
  width: 1123px;
  height: 1587px;
  overflow: hidden;
  background:
    radial-gradient(120% 70% at 50% 38%, #1a2440 0%, #0c1122 45%, #05070d 100%);
  font-family: 'Inter', sans-serif;
  color: #eef2fb;
}

/* ---- cornice sottile ---- */
.frame {
  position: absolute; inset: 34px;
  border: 1px solid rgba(148,163,184,0.22);
  border-radius: 4px;
  pointer-events: none;
}

/* ---- etichette in alto ---- */
.toplabel {
  position: absolute; top: 70px; left: 0; right: 0;
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: 18px; letter-spacing: 7px;
  color: #8595b4; text-transform: uppercase;
}
.eptag {
  position: absolute; top: 104px; left: 0; right: 0;
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: 14px; letter-spacing: 5px;
  color: #ec4899;
}

/* ---- arte centrale: la Giuntura + la porta ---- */
.art { position: absolute; top: 196px; left: 0; right: 0; height: 760px; }

/* ---- titolo ---- */
.titlewrap { position: absolute; left: 90px; right: 90px; top: 1000px; text-align: center; }
.kicker {
  font-family: 'Space Mono', monospace;
  font-size: 16px; letter-spacing: 6px; text-transform: uppercase;
  color: #9aa7c4; margin-bottom: 26px;
}
.title {
  font-family: 'Playfair Display', serif;
  font-weight: 700; font-size: 92px; line-height: 0.98;
  color: #f6f8ff; letter-spacing: -0.5px;
}
.title .accent { color: #f4b65a; font-style: italic; font-weight: 500; }
.subtitle {
  font-family: 'Playfair Display', serif;
  font-style: italic; font-weight: 500; font-size: 30px; line-height: 1.42;
  color: #aeb9d4; margin-top: 40px; padding: 0 30px;
}

/* ---- piede ---- */
.footer {
  position: absolute; left: 70px; right: 70px; bottom: 78px;
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'Space Mono', monospace; font-size: 16px; letter-spacing: 2px;
  color: #7f8db0;
}
.footer .dot { color: #f4b65a; }
.footer .nina { color: #ec4899; }
.tagline {
  position: absolute; left: 0; right: 0; bottom: 132px; text-align: center;
  font-family: 'Space Mono', monospace; font-size: 14px; letter-spacing: 4px;
  color: #62718f; text-transform: uppercase;
}
</style>
</head>
<body>
  <div class="poster" data-canvas-width="1123" data-canvas-height="1587">
    <div class="frame"></div>

    <div class="toplabel">Titanium&nbsp;OS · L'Avventura</div>
    <div class="eptag">EP_N2_01 — CASELLA 1</div>

    <!-- ====== ARTE: la Giuntura (Atomi | Bit) e la porta luminosa ====== -->
    <svg class="art" viewBox="0 0 1123 760" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="doorGlow" cx="50%" cy="42%" r="60%">
          <stop offset="0%" stop-color="#ffe6ad" stop-opacity="0.95"/>
          <stop offset="35%" stop-color="#f4b65a" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#f4b65a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="doorFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff4dc"/>
          <stop offset="55%" stop-color="#ffcf85"/>
          <stop offset="100%" stop-color="#eda24a"/>
        </linearGradient>
        <linearGradient id="bridge" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6b7da0" stop-opacity="0.0"/>
          <stop offset="100%" stop-color="#9fb0d0" stop-opacity="0.55"/>
        </linearGradient>
      </defs>

      <!-- alone caldo dietro la porta -->
      <circle cx="561" cy="320" r="430" fill="url(#doorGlow)"/>

      <!-- ATOMI (sinistra) — geometrie d'acciaio, fredde -->
      <g stroke="#5d6f8c" stroke-width="2.4" fill="none" opacity="0.5">
        <!-- dado esagonale -->
        <polygon points="150,250 196,224 242,250 242,302 196,328 150,302"/>
        <circle cx="196" cy="276" r="17"/>
        <!-- ingranaggio -->
        <circle cx="250" cy="470" r="42"/>
        <circle cx="250" cy="470" r="17"/>
        <g stroke-width="3">
          <line x1="250" y1="416" x2="250" y2="432"/>
          <line x1="250" y1="508" x2="250" y2="524"/>
          <line x1="196" y1="470" x2="212" y2="470"/>
          <line x1="288" y1="470" x2="304" y2="470"/>
          <line x1="212" y1="432" x2="223" y2="443"/>
          <line x1="277" y1="497" x2="288" y2="508"/>
          <line x1="288" y1="432" x2="277" y2="443"/>
          <line x1="223" y1="497" x2="212" y2="508"/>
        </g>
        <!-- staffa / bullone -->
        <rect x="120" y="560" width="120" height="30" rx="6"/>
        <line x1="150" y1="560" x2="150" y2="590"/>
        <line x1="210" y1="560" x2="210" y2="590"/>
      </g>
      <text x="150" y="172" font-family="Space Mono, monospace" font-size="20"
            letter-spacing="5" fill="#7c8cab" opacity="0.85">ATOMI</text>

      <!-- BIT (destra) — formiche di luce, rete -->
      <g stroke="#5fc7f3" stroke-width="1.6" opacity="0.5">
        <line x1="900" y1="250" x2="980" y2="300"/>
        <line x1="980" y1="300" x2="930" y2="380"/>
        <line x1="930" y1="380" x2="1000" y2="430"/>
        <line x1="900" y1="250" x2="860" y2="340"/>
        <line x1="860" y1="340" x2="930" y2="380"/>
        <line x1="860" y1="500" x2="930" y2="380"/>
        <line x1="860" y1="500" x2="950" y2="540"/>
      </g>
      <g fill="#9adcff">
        <circle cx="900" cy="250" r="7"/>
        <circle cx="980" cy="300" r="5"/>
        <circle cx="930" cy="380" r="8"/>
        <circle cx="860" cy="340" r="5"/>
        <circle cx="1000" cy="430" r="6"/>
        <circle cx="860" cy="500" r="5"/>
        <circle cx="950" cy="540" r="7"/>
      </g>
      <g fill="#cfeeff" opacity="0.9">
        <circle cx="1030" cy="250" r="2.5"/>
        <circle cx="820" cy="420" r="2.5"/>
        <circle cx="990" cy="510" r="2.5"/>
        <circle cx="900" cy="600" r="2.5"/>
      </g>
      <text x="975" y="172" font-family="Space Mono, monospace" font-size="20"
            letter-spacing="5" fill="#6fb7dd" opacity="0.9" text-anchor="end">BIT</text>

      <!-- IL PONTE (la Giuntura) — prospettiva verso la porta -->
      <polygon points="561,300 360,720 763,720" fill="url(#bridge)" opacity="0.6"/>
      <g stroke="#aebdda" stroke-width="2" opacity="0.45">
        <line x1="561" y1="300" x2="360" y2="720"/>
        <line x1="561" y1="300" x2="763" y2="720"/>
        <line x1="470" y1="490" x2="652" y2="490"/>
        <line x1="430" y1="575" x2="692" y2="575"/>
        <line x1="392" y1="660" x2="730" y2="660"/>
      </g>

      <!-- LA PORTA non vista, socchiusa, luce che esce -->
      <g>
        <path d="M495,300 Q495,150 561,150 Q627,150 627,300 L627,470 L495,470 Z"
              fill="#0a0f1d" stroke="#f4b65a" stroke-width="3"/>
        <!-- spiraglio di luce -->
        <path d="M561,150 Q627,150 627,300 L627,470 L561,470 Z" fill="url(#doorFill)" opacity="0.92"/>
        <line x1="561" y1="160" x2="561" y2="466" stroke="#fff4dc" stroke-width="2" opacity="0.8"/>
        <circle cx="600" cy="318" r="5" fill="#7a5a24"/>
      </g>
    </svg>

    <!-- ====== TITOLO ====== -->
    <div class="titlewrap">
      <div class="kicker">C'era una bambina che faceva una domanda di troppo</div>
      <div class="title">La Bambina<br/>che Chiedeva <span class="accent">Perché</span></div>
      <div class="subtitle">«Fatto bene non vuol dire bello —<br/>vuol dire che regge quando lo tiri.»</div>
    </div>

    <div class="tagline">Una sola domanda · pezzo per pezzo</div>
    <div class="footer">
      <span><span class="dot">⟡0</span>&nbsp;La Materia</span>
      <span class="nina">NINA</span>
      <span>~13 min · da leggere ad alta voce</span>
    </div>
  </div>
</body>
</html>
