// ─── CONNESSIONI NEURALI PER LIVELLO ────────────────────────────────────────
const CONNECTIONS = {

  cv:      [['cv','scproject'],['cv','essegi'],['cv','datwler'],['cv','luve'],

};

// ─── STATE ──────────────────────────────────────────────────────────────────
const CX = () => window.innerWidth  / 2;
const CY = () => (window.innerHeight - 44) / 2;
const RADII = [0, 190, 320];
const NODE_R = { root: 58, xl: 46, md: 36, sm: 26 };

function getR(id, level) {
  if (level === 0) return NODE_R.root;
  const n = NODES[id];
  if (!n) return NODE_R.md;
  if (id === state.stack[state.stack.length-1]?.centerId) return NODE_R.xl;
  return NODE_R.md;
}

const state = {
  stack: [{ centerId: 'root', centerColor: '#10b981', label: 'ROOT' }],
  activeNode: null,
  zoomNode:   null,
  animKey:    0,
};

// ─── RADIAL LAYOUT ───────────────────────────────────────────────────────────
function radialPos(idx, total, ring) {
  const angle = (-90 + idx * (360 / total)) * (Math.PI / 180);
  const r = RADII[ring] || RADII[1];
  return {
    x: CX() + r * Math.cos(angle),
    y: CY() + r * Math.sin(angle),
  };
}

function buildLevel(centerId) {
  const node = NODES[centerId];
  const children = node?.children || [];
  const ring1 = children.slice(0, Math.min(children.length, 6));
  const ring2 = children.slice(6);

  const positions = {};
  positions[centerId] = { x: CX(), y: CY() };

  ring1.forEach((id, i) => {
    positions[id] = radialPos(i, ring1.length, 1);
  });
  ring2.forEach((id, i) => {
    positions[id] = radialPos(i, ring2.length, 2);
  });

  return {
    nodeIds: [centerId, ...ring1, ...ring2],
    positions,
    connections: CONNECTIONS[centerId] || [],
  };
}

// ─── SVG HELPERS ────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs={}) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function arcPath(cx, cy, r, pct) {
  if (pct <= 0) return '';
  const start = -Math.PI/2;
  const end   = start + (pct/100) * 2 * Math.PI;
  const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
  const x2 = cx + r * Math.cos(end),   y2 = cy + r * Math.sin(end);
  const large = pct > 50 ? 1 : 0;
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}
function curvePath(x1,y1,x2,y2) {
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const dx = x2-x1, dy = y2-y1;
  const len = Math.sqrt(dx*dx+dy*dy)||1;
  const off = len*0.08;
  return `M ${x1} ${y1} Q ${mx+(-dy/len)*off} ${my+(dx/len)*off} ${x2} ${y2}`;
}

// ─── RENDER ─────────────────────────────────────────────────────────────────

  const svg = document.getElementById('map-svg');
  svg.innerHTML = '';
  svg.setAttribute('width', window.innerWidth);
  svg.setAttribute('height', window.innerHeight - 44);

  const level = state.stack.length - 1;
  const centerId = state.stack[level].centerId;
  const { nodeIds, positions, connections } = buildLevel(centerId);
  const centerColor = NODES[centerId]?.color || '#10b981';

  // ── Radial glow ──
  const defs = el('defs');
  const rg = el('radialGradient', { id:'centerGlow', cx:'50%', cy:'50%', r:'45%' });
  const s1 = el('stop', { offset:'0%',   'stop-color': centerColor, 'stop-opacity':'0.08' });
  const s2 = el('stop', { offset:'100%', 'stop-color': centerColor, 'stop-opacity':'0' });
  rg.appendChild(s1); rg.appendChild(s2); defs.appendChild(rg);

  // Arrowhead markers
  const mk1 = el('marker', { id:'arr-s', markerWidth:'6', markerHeight:'6', refX:'5', refY:'3', orient:'auto' });
  const mp1 = el('path', { d:'M0,0 L0,6 L6,3 z', fill:'rgba(255,255,255,0.15)' });
  mk1.appendChild(mp1); defs.appendChild(mk1);
  const mk2 = el('marker', { id:'arr-d', markerWidth:'5', markerHeight:'5', refX:'4', refY:'2.5', orient:'auto' });
  const mp2 = el('path', { d:'M0,0 L0,5 L5,2.5 z', fill:'rgba(255,255,255,0.08)' });
  mk2.appendChild(mp2); defs.appendChild(mk2);
  svg.appendChild(defs);

  // ── Background glow rect ──
  const glowRect = el('rect', { width:'100%', height:'100%', fill:'url(#centerGlow)' });
  svg.appendChild(glowRect);

  // ── Pulse rings ──
  nodeIds.forEach((id, idx) => {
    const n = NODES[id];
    if (!n?.pulse) return;
    const pos = positions[id];
    const r = getR(id, idx===0 ? 0 : 1) + 18;
    const ring = el('circle', {
      cx: pos.x, cy: pos.y, r,
      fill: 'none',
      stroke: n.color,
      'stroke-width': 1.2,
      class: 'pulse-ring',
    });
    ring.style.setProperty('--pr', r+'px');
    svg.appendChild(ring);
  });

  // ── drillZoom burst ──
  if (state.zoomNode && positions[state.zoomNode]) {
    const zp = positions[state.zoomNode];
    const zn = NODES[state.zoomNode];
    const burst = el('circle', {
      cx: zp.x, cy: zp.y, r: 50,
      fill: hexToRgba(zn?.color || '#10b981', 0.06),
      stroke: zn?.color || '#10b981',
      'stroke-width': 1,
      class: 'drill-burst',
    });
    svg.appendChild(burst);
  }

  // ── Connessioni ──
  const connGroup = el('g');
  connections.forEach(([from, to, label]) => {
    const fp = positions[from], tp = positions[to];
    if (!fp || !tp) return;
    const fromN = NODES[from];
    const color = fromN?.color || '#334155';
    const isRoot = from === centerId || to === centerId;
    const isActive = state.activeNode === from || state.activeNode === to;
    const opacity = isActive ? (isRoot ? 0.55 : 0.4) : (isRoot ? 0.2 : 0.1);

    const path = el('path', {
      d: curvePath(fp.x, fp.y, tp.x, tp.y),
      stroke: color, 'stroke-width': isRoot ? 1.5 : 1,
      fill: 'none', opacity,
      'stroke-dasharray': isRoot ? undefined : '5,4',
      'marker-end': isRoot ? 'url(#arr-s)' : 'url(#arr-d)',
      class: 'conn-path',
    });
    connGroup.appendChild(path);

    if (label && isActive) {
      const mx = (fp.x + tp.x)/2, my = (fp.y + tp.y)/2;
      const txt = el('text', {
        x: mx, y: my - 5, 'text-anchor':'middle',
        fill: color, 'font-size': 7, 'font-family': 'inherit',
        opacity: 0.6,
      });
      txt.textContent = label;
      connGroup.appendChild(txt);
    }
  });
  svg.appendChild(connGroup);

  // ── Nodi ──
  nodeIds.forEach((id, idx) => {
    const n = NODES[id];
    if (!n) return;
    const pos = positions[id];
    const isCenterNode = id === centerId && level > 0;
    const nodeLevel = idx === 0 ? 0 : 1;
    const r = getR(id, nodeLevel);
    const hasChildren = !!(n.children?.length);
    const isActive = state.activeNode === id;
    const delay = idx * 42;

    const g = el('g', { class: 'node-group' });
    g.style.setProperty('--delay', delay + 'ms');
    g.style.setProperty('--node-color', n.color);

    // Progress track + arc
    if (n.pct !== null && n.pct !== undefined) {
      const pr = r + 6;
      const track = el('circle', { cx: pos.x, cy: pos.y, r: pr, class:'node-circle-track' });
      g.appendChild(track);
      if (n.pct > 0) {
        const arc = el('path', {
          d: arcPath(pos.x, pos.y, pr, n.pct),
          stroke: n.color, 'stroke-width': 2.5, fill: 'none',
          'stroke-linecap': 'round',
          opacity: 0.7,
        });
        g.appendChild(arc);
      }
    }

    // Circle
    const circle = el('circle', {
      cx: pos.x, cy: pos.y, r,
      fill: '#0f172a',
      stroke: n.color,
      'stroke-width': 1.5,
      'stroke-opacity': isActive ? 1 : 0.65,
      class: 'node-circle',
    });
    if (isActive) {
      circle.setAttribute('filter', `drop-shadow(0 0 8px ${n.color})`);
    }
    g.appendChild(circle);

    // Status dot
    const dotColor = n.pct === 100 ? '#10b981' : n.pulse ? n.color : '#334155';
    const dot = el('circle', { cx: pos.x + r*0.6, cy: pos.y - r*0.6, r: 2.8, fill: dotColor });
    g.appendChild(dot);

    // Label
    const lines = n.label.split('\n');
    const lineH = idx === 0 && level === 0 ? 16 : r > 33 ? 13 : 11;
    const fontSize = idx === 0 && level === 0 ? 12 : r > 33 ? 10 : 8.5;
    lines.forEach((line, li) => {
      const t = el('text', {
        x: pos.x,
        y: pos.y + (li - (lines.length-1)/2) * lineH + (n.sub ? -5 : 0),
        fill: n.color, 'font-size': fontSize,
        class: 'node-label',
      });
      t.textContent = line;
      g.appendChild(t);
    });

    // Sub
    if (n.sub) {
      const sub = el('text', {
        x: pos.x, y: pos.y + lines.length * lineH * 0.5 + (n.sub ? 3 : 0),
        fill: '#475569', 'font-size': Math.max(7, fontSize - 2),
        class: 'node-sub',
      });
      sub.textContent = n.sub;
      g.appendChild(sub);
    }

    // Drill indicator
    if (isCenterNode) {
      const di = el('text', { x: pos.x, y: pos.y + r - 8, 'font-size': 7, fill: n.color, 'text-anchor':'middle', opacity: 0.5 });
      di.textContent = '← su';
      g.appendChild(di);
    } else if (hasChildren) {
      const di = el('text', { x: pos.x, y: pos.y + r - 6, 'font-size': 7, fill: n.color, 'text-anchor':'middle', opacity: 0.45 });
      di.textContent = '▶';
      g.appendChild(di);
    }

    // Events
    g.addEventListener('click', () => handleClick(id));
    g.style.cursor = isCenterNode ? 'zoom-out' : hasChildren ? 'zoom-in' : 'pointer';

    svg.appendChild(g);
  });
}

// ─── NAVIGATION ─────────────────────────────────────────────────────────────
function handleClick(id) {
  const level = state.stack.length - 1;
  const centerId = state.stack[level].centerId;
  const n = NODES[id];
  if (!n) return;

  // Centro in drill → vai su
  if (level > 0 && id === centerId) {
    drillBack();
    return;
  }

  // Ha figli → drill in
  if (n.children?.length) {
    drillInto(id);
    return;
  }

  // Mostra detail
  openDetail(id);
}

function drillInto(id) {
  const n = NODES[id];
  if (!n?.children?.length) return;

  // Burst
  state.zoomNode = id;
  render();
  setTimeout(() => { state.zoomNode = null; }, 440);

  // Transizione
  const svg = document.getElementById('map-svg');
  svg.style.opacity = 0;
  svg.style.transform = 'scale(0.97)';
  svg.style.transition = 'opacity 0.22s, transform 0.22s';

  setTimeout(() => {
    state.stack.push({ centerId: id, centerColor: n.color, label: n.label.replace('\n',' ') });
    state.activeNode = null;
    closeDetail();
    updateBreadcrumb();
    updateWatermark();
    render();
    svg.style.transition = 'none';
    svg.style.opacity = 0;
    svg.style.transform = 'translateY(8px) scale(0.97)';
    requestAnimationFrame(() => {
      svg.style.transition = 'opacity 0.3s, transform 0.3s';
      svg.style.opacity = 1;
      svg.style.transform = 'none';
    });
  }, 240);
}

function drillBack(targetIdx) {
  if (state.stack.length <= 1) return;

  const svg = document.getElementById('map-svg');
  svg.style.opacity = 0;
  svg.style.transform = 'scale(0.97)';
  svg.style.transition = 'opacity 0.2s, transform 0.2s';

  setTimeout(() => {
    if (targetIdx !== undefined) {
      state.stack = state.stack.slice(0, targetIdx + 1);
    } else {
      state.stack.pop();
    }
    state.activeNode = null;
    closeDetail();
    updateBreadcrumb();
    updateWatermark();
    render();
    svg.style.transition = 'none';
    svg.style.opacity = 0;
    requestAnimationFrame(() => {
      svg.style.transition = 'opacity 0.28s, transform 0.28s';
      svg.style.opacity = 1;
      svg.style.transform = 'none';
    });
  }, 220);
}

// ─── UI HELPERS ─────────────────────────────────────────────────────────────
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = '';

  // Bottone ← visibile quando in drill
  if (state.stack.length > 1) {
    const back = document.createElement('button');
    back.textContent = '← INDIETRO';
    back.style.cssText = `
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: #94a3b8; font-family: inherit; font-size: 8px; letter-spacing: 0.15em;
      text-transform: uppercase; padding: 3px 10px; border-radius: 6px;
      cursor: pointer; margin-right: 8px; transition: background 0.15s;
    `;
    back.onmouseenter = () => back.style.background = 'rgba(255,255,255,0.08)';
    back.onmouseleave = () => back.style.background = 'rgba(255,255,255,0.04)';
    back.addEventListener('click', () => drillBack());
    bc.appendChild(back);
  }

  state.stack.forEach((entry, idx) => {
    if (idx > 0) {
      const sep = document.createElement('span');
      sep.className = 'bc-sep'; sep.textContent = '/';
      bc.appendChild(sep);
    }
    const item = document.createElement('span');
    item.className = 'bc-item' + (idx === state.stack.length-1 ? ' active' : '');
    item.textContent = entry.label;
    item.dataset.idx = idx;
    if (idx < state.stack.length - 1) {
      item.style.color = state.stack[idx+1]?.centerColor || '#475569';
      item.addEventListener('click', () => drillBack(idx));
    }
    bc.appendChild(item);
  });
}

function updateWatermark() {
  const wm = document.getElementById('level-wm');
  const level = state.stack.length - 1;
  if (level > 0) {
    wm.style.display = 'block';
    wm.textContent = 'L' + level;
    wm.style.color = state.stack[level].centerColor + '0a';
  } else {
    wm.style.display = 'none';
  }
}

let detailCurrentId = null;
function openDetail(id) {
  const n = NODES[id];
  if (!n) return;
  detailCurrentId = id;
  state.activeNode = id;

  document.getElementById('detail-label').textContent = n.label.replace('\n', ' ');
  document.getElementById('detail-label').style.color = n.color;
  document.getElementById('detail-sub').textContent = n.sub || '';
  document.getElementById('detail-body').textContent = n.detail || '';
  document.getElementById('detail-accent').style.background = n.color;

  const drillBtn = document.getElementById('detail-drill');
  if (n.children?.length) {
    drillBtn.style.display = 'inline-flex';
    drillBtn.style.color = n.color;
    drillBtn.style.borderColor = n.color + '40';
  } else {
    drillBtn.style.display = 'none';
  }

  document.getElementById('detail').classList.add('open');
  render(); // aggiorna highlight connessioni
}

function closeDetail() {
  document.getElementById('detail').classList.remove('open');
  state.activeNode = null;
  detailCurrentId = null;
  render();
}

function drillFromDetail() {
  if (detailCurrentId) drillInto(detailCurrentId);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => render());
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('detail').classList.contains('open')) closeDetail();
    else if (state.stack.length > 1) drillBack();
  }
});

document.addEventListener('DOMContentLoaded', () => {
  updateBreadcrumb();
  updateWatermark();
  render();
});
</script>
</body>
</html>
